<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #101114;
      color: #f5f5f5;
    }
    * { box-sizing: border-box; }
    body { display: grid; min-height: 100vh; place-items: center; margin: 0; padding: 20px; background: radial-gradient(ellipse at top, #202128 0, #101114 58%); }
    form { width: min(100%, 420px); padding: 24px; border: 1px solid #30313a; border-radius: 18px; background: #191a20; }
    label { display: block; margin-bottom: 16px; font-size: .9rem; font-weight: 600; }
    input { display: block; width: 100%; margin-top: 8px; padding: 14px 16px; border: 1px solid #3c3d48; border-radius: 10px; background: #111217; color: #fff; font: inherit; }
    input:focus { outline: 2px solid #8b5cf6; outline-offset: 2px; }
    button { width: 100%; padding: 13px 18px; border: 0; border-radius: 10px; background: #7c3aed; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
    button:hover { background: #6d28d9; }
    .message { margin: 0 0 16px; color: #fdba74; line-height: 1.5; }
  </style>
</head>
<body>
  <main>
    <form method="post" action="{{ url_for('login') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      {% if error %}<p class="message" role="alert">{{ error }}</p>{% endif %}
      <label for="username">Usuário
        <input id="username" name="username" type="text" autocomplete="username" required autofocus>
      </label>
      <label for="password">Senha
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </label>
      <button type="submit">Entrar</button>
    </form>
  </main>
</body>
</html>
