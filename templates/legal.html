<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }} · Painel de Cortes Prontos</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #101114;
      color: #f5f5f5;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: radial-gradient(ellipse at top, #202128 0, #101114 58%); }
    main { width: min(760px, calc(100% - 32px)); margin: 0 auto; padding: 56px 0; }
    a { color: #c4b5fd; }
    .back-link { display: inline-block; margin-bottom: 24px; font-size: .9rem; font-weight: 600; text-decoration: none; }
    h1 { margin: 0 0 28px; font-size: clamp(2rem, 6vw, 3rem); letter-spacing: -.04em; }
    section { margin-top: 20px; padding: 20px; border: 1px solid #30313a; border-radius: 14px; background: #191a20; }
    h2 { margin: 0 0 10px; font-size: 1rem; }
    p { margin: 10px 0 0; color: #c4c4cc; line-height: 1.65; }
    footer { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 28px; font-size: .85rem; }
  </style>
</head>
<body>
  <main>
    <a class="back-link" href="{{ url_for('index') }}">← Voltar ao painel</a>
    <h1>{{ title }}</h1>
    {% for section in sections %}
      <section>
        <h2>{{ section.heading }}</h2>
        {% for paragraph in section.paragraphs %}
          <p>{{ paragraph }}</p>
        {% endfor %}
      </section>
    {% endfor %}
    <footer>
      <a href="{{ url_for('privacy') }}">Política de Privacidade</a>
      <a href="{{ url_for('terms') }}">Termos de Uso</a>
    </footer>
  </main>
</body>
</html>
